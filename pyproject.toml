[project]
name = "local-ai-agent"
version = "0.0.0"
description = "Local LLM AI Agent platform — headless, API-first, modular agent over a local Gemma model."
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyjwt>=2.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
# Capability deps are lazy-imported (a missing one disables only that format/connector,
# never an import crash), so they are optional, not core. Install per enabled capability.
docqa = [
    "pypdf>=4", # .pdf loader
    "python-docx>=1", # .docx loader
    "beautifulsoup4>=4", # .html loader
]
storage = [
    "asyncssh>=2.14", # SSH/SFTP connector
]
browser = [
    # httpx is already a core dependency (the HTTP fetcher, fetch-parse v1).
    "trafilatura>=1.8", # main-content extraction — lazy-imported in 
]
exec = [
    # is pure (no runtime dep). The Docker round-trip lands in ; the client
    # (docker SDK vs `docker` CLI subprocess) is decided then and added here, lazy-imported.
]
mcp = [
    # The official MCP Python SDK (D2), lazy-imported behind `SdkMcpClient`. 's policy/
    # seam are SDK-free; this dep is needed only for the concrete stdio transport.
    "mcp>=1.2",
]
multimodal = [
    # PyMuPDF rasterizes UNTRUSTED scan-PDFs to page images (bounded), lazy-imported in
    # `modules/docqa/render.py`. A single wheel (bundled mupdf — no system poppler). Absent → the
    # visual path degrades to a typed MultimodalUnavailable, never an import crash.
    "pymupdf>=1.24",
]

[project.scripts]
local-ai-agent = "local_ai_agent.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
